# registry/bands.yaml — 주파수 대역 어휘 (band_registry_contract)
#
# 성격: **(b) 외부 포맷 규약**이다. 우리가 정하는 값이 아니라 표준이 정한 값을 옮겨 적는다.
#       그래서 항목마다 `산지`가 붙는다 — 근거 없이 범위를 적지 않는다.
#
# 두 체계가 섞여 있음에 주의
#   ieee_letter   IEEE Std 521 문자 대역(X · Ku · Ka …). **레이더 관례**다
#   application   용도로 부르는 대역(77 GHz 차량 레이더 · 24 GHz ISM). 문자 대역이 아니다
#   두 체계를 한 목록에 두되 `kind` 로 구분한다. 섞어 놓고 구분하지 않으면
#   "77GHz 밴드가 무슨 문자 대역이냐"는 답 없는 질문이 생긴다.
#
# ★ 중요 — 문자 대역은 **너무 넓다.**
#   X-band 는 8~12 GHz 이지만 해상 레이더는 그 안의 **9.3~9.5 GHz** 만 쓴다.
#   대역만 선언하고 끝내면 대조가 헐거워진다 → `operating` 으로 실제 운용 범위를 적는다.
#   대조는 `operating` 이 있으면 그것으로, 없으면 문자 대역 범위로 한다.
#
# 초안 2026-07-31 · 확정: 사람

spec_version: "draft-2026-07-31"

bands:

  X:
    kind: ieee_letter
    label: "X 대역"
    range_ghz: [8.0, 12.0]
    산지: "IEEE Std 521 문자 대역 — 외부 규약"
    operating:
      marine_radar:
        range_ghz: [9.3, 9.5]
        산지: "해상 레이더 관례 대역 — 확정: 사람(ITU 할당 근거 확인 필요)"
        note: "해상 레이더가 쓰는 범위 (예시)"

  S:
    kind: ieee_letter
    label: "S 대역"
    range_ghz: [2.0, 4.0]
    산지: "IEEE Std 521"
    operating:
      marine_radar:
        range_ghz: [2.9, 3.1]
        산지: "해상 레이더 관례 대역 — 확정: 사람"

  C:
    kind: ieee_letter
    label: "C 대역"
    range_ghz: [4.0, 8.0]
    산지: "IEEE Std 521"

  Ku:
    kind: ieee_letter
    label: "Ku 대역"
    range_ghz: [12.0, 18.0]
    산지: "IEEE Std 521"

  K:
    kind: ieee_letter
    label: "K 대역"
    range_ghz: [18.0, 27.0]
    산지: "IEEE Std 521"

  Ka:
    kind: ieee_letter
    label: "Ka 대역"
    range_ghz: [27.0, 40.0]
    산지: "IEEE Std 521"

  V:
    kind: ieee_letter
    label: "V 대역"
    range_ghz: [40.0, 75.0]
    산지: "IEEE Std 521"

  W:
    kind: ieee_letter
    label: "W 대역"
    range_ghz: [75.0, 110.0]
    산지: "IEEE Std 521"

  # ── 용도 대역 — 문자 대역이 아니다 ────────────────────────────────────────
  "24GHz_ISM":
    kind: application
    label: "24 GHz ISM"
    range_ghz: [24.0, 24.25]
    산지: "ITU ISM 할당 — 확정: 사람"

  "60GHz":
    kind: application
    label: "60 GHz 대역"
    range_ghz: [57.0, 71.0]
    산지: "비면허 mmWave — 확정: 사람"
    note: "사내 실물 `test2`·`20250522_single_chip_full_pcb` 가 50~70 GHz 를 선언한다"

  "77GHz":
    kind: application
    label: "77 GHz 차량 레이더"
    range_ghz: [76.0, 81.0]
    산지: "차량 레이더 할당 — 확정: 사람"
    note: "76~77(장거리) · 77~81(단거리) 로 다시 갈린다. 필요해지면 operating 으로 쪼갠다"

# ── 대조 규율 (2026-07-31 정정) ─────────────────────────────────────────────
#
# ★ 무엇이 대역 안에 있어야 하는가 — 전부가 아니다.
#
#   안테나가 목표 대역 밖에서도 잘 받을 수 있다. 목표 밖 주파수는 **필터가 거른다**
#   (사용자 확인 2026-07-31). 그러므로 "기하에서 계산한 공진이 대역 밖"인 것은
#   **결함이 아니다.** 그것을 경고로 띄우면 진짜 신호가 묻힌다.
#
#   더 중요한 이유 — 소자 하나의 λ/2 공진은 **배열의 동작 주파수가 아니다.**
#   콤 라인·직렬 급전 배열에서는 소자 간격과 급전망이 동작점을 정한다. 둘을 같은
#   자리에 놓고 비교한 것이 애초에 틀렸다.
#
# 그래서 역할을 세 등급으로 나눈다.
비교:
  band_tolerance: 0.10        # 대역 경계에서 이 비율만큼은 벗어나도 말하지 않는다
  산지: "관측 근거 없음 — 표본이 쌓이면 재조정한다"

  # ① 대역 안에 있어야 한다 — 어긋나면 **경고**
  must_match:
    - band_lo_ghz              # 원천이 스스로 선언한 동작 대역
    - band_hi_ghz
  why_must: "원천이 선언한 동작 대역이 목표와 다르면 원천이 다르거나 선언이 틀렸다"

  # ② 대역 근처면 좋다 — 어긋나면 **정보**(경고 아님)
  should_match:
    - farfield_freq_min_ghz    # 시뮬 요청 주파수 — 보통 목표 근처지만 아닐 수도 있다
    - farfield_freq_max_ghz
  why_should: "설계자가 다른 대역도 함께 보는 경우가 있다"

  # ③ 대역과 비교하지 않는다 — 애초에 다른 양이다
  do_not_compare:
    - resonance_free_min_ghz
    - resonance_free_max_ghz
    - resonance_substrate_min_ghz
    - resonance_substrate_max_ghz
    - param_resonance_ghz
  why_not: >
    소자 하나의 λ/2 공진은 배열의 동작 주파수가 아니다. 콤 라인·직렬 급전에서는 소자
    간격과 급전망이 동작점을 정한다. 또 목표 밖 응답은 필터가 거른다 —
    대역 밖이라는 사실 자체가 결함의 근거가 되지 않는다.
