# registry/products.yaml — 검산 임계·예산의 유일한 주입원 (product_registry_contract)
#
# 성격: 완성 목록이 아니라 증분 등재다. 파이프라인은 이 파일을 읽기만 한다(W-2).
# 규율: 임계를 코드·env·프롬프트에 하드코딩하지 않는다. 여기 없는 임계는 "없음"으로 남는다.
#
# ▣ 이 파일은 튜너가 작성한 **초안**이다. `확정: 사람` 이 붙은 값은 사용자가 확정해야 한다.
#   확정 전까지 해석 도구는 그 항목을 판정하지 않고 "임계 미지정"으로 남긴다(I-5 · N-3).
#   초안 2026-07-30

registry_version: "2026-08-03"      # 견본 — 실제 등재는 ORCH_DATA_DIR 쪽에 둔다

products:

  # ── 광역 기본값 — 제품군 미배정 원천이 쓴다 ────────────────────────────────
  # 광역(wide-open)의 뜻: "이 범위를 벗어나면 물리적으로 이상하다"는 하한선일 뿐,
  # 설계 목표가 아니다. 따라서 pass=True 가 "좋다"는 뜻이 되지 않는다.
  default:
    label: "광역 기본값 (제품군 미배정)"
    use: null                       # 제품군 미배정이므로 용도가 없다
    band_ghz: [1.0, 100.0]          # 규모 타당성용 광역 범위 · 확정: 사람(제품군 배정 시 교체)
    substrate:
      name: null                    # 확정: 사람 — 도면에 재질 선언이 없으면 채우지 않는다
      er: null                      # null = 임계 미지정 → 기판 파장 계산을 하지 않는다
      h_mm: null                    # null = 추출값(elevation) 사용
    thresholds:
      resonance_tol: null           # 확정: 사람 — 공진 정합 허용 오차(비율)
      hbw_target_deg: null          # 확정: 사람 — 목표 반전력 빔폭 [lo, hi] (deg)
      hbw_uniform_factor: null      # 모델 가정 — 개구 빔폭 계수 k. null 이면 코드 기본값
                                    #   0.886(균일 조명)을 쓰고 해석이 그 사실을 inputs 에 적는다.
                                    #   테이퍼 조명이면 사람이 실제 값(≈1.0~1.3)으로 채운다.
      pitch_tol: 0.05               # 배열 주기 산포 허용(비율) — 균일 배열 가정의 검사용
      scale_bbox_mm: [1.0, 2000.0]  # 규모 타당성 — 이 밖이면 원천 오배치 의심
    # ── 예산 (B-1) ──────────────────────────────────────────────────────────
    # 예산 값에도 **산지**가 있어야 한다. 수치 상수와 같은 규율이다(tools/_common.py 분류 참조).
    #   [정본]  AGENTS.md B-1 이 직접 정한 값 — 우리가 고를 것이 아니다
    #   [관측]  원장에 쌓인 실행 이력의 분포에서 정하는 값 — 근거가 생기면 채운다
    #   null    아직 정할 근거가 없다 → 해당 기능은 **닫힌다**(그럴듯한 값을 넣지 않는다)
    budgets:
      max_gate_rejects: 3           # [정본] AGENTS.md B-1 "게이트 반려 ≤3회"
      max_retries: 3                # [정본] AGENTS.md B-1 "재시도 ≤3회" (노드 내 일시 실패)
      compute_minutes: 10           # [정본] AGENTS.md B-1 "원천당 누적 10분"

      # ↓ 아래 둘은 정본에 없는 값이다. 근거 없이 숫자를 넣으면 임계를 지어내는 것과 같다.
      #   null 인 동안 제한적 재량은 **열리지 않는다**(attempt_context.discretion_open=False).
      discretion_after_holds: null  # [관측] 몇 번 막혀야 방법을 바꿀 만한가.
                                    #   필요한 근거: HOLD 원인별 분포 + 같은 원인 반복률.
                                    #   현재 실제 실행 HOLD 0건 → 정할 수 없다.
      max_attempts: null            # [관측] 같은 run_id 로 재투입할 수 있는 **총 시도 횟수 상한**.
                                    #
                                    #   역할 — 재량의 정지 조건이다. 셋을 구분해야 한다.
                                    #     max_retries(3)        같은 방법을 그대로 다시 — 일시 실패용(B-1 정본)
                                    #     max_gate_rejects(3)   같은 문서를 다시 조립 — 게이트 반려용(B-1 정본)
                                    #     max_attempts          **방법을 바꿔 가며** 다시 — 재량용(정본에 없다)
                                    #   앞의 둘은 "같은 것을 반복"이라 발산하지 않는다. 재량은 매번 다른 것을
                                    #   시도하므로 스스로 멈추지 않는다 → 상한이 없으면 무한히 변주한다.
                                    #   attempt_context 가 attempt >= max_attempts 이면 discretion_open=False
                                    #   로 닫고 사람에게 넘긴다(A-1·A-3).
                                    #
                                    #   왜 null 인가 — 값을 정하려면 "N회차에서 풀린 비율"이 있어야 한다.
                                    #   재량이 닫혀 있으니 재량 시도가 0건이고, 표본이 영영 0이다(닭과 달걀).
                                    #   앞서 초안에 적힌 6 은 근거 없는 숫자였다 → 지웠다.
                                    #   여는 방법: 사람이 이 값을 정해 넣는다(A-1). 그 순간부터 표본이 쌓이고,
                                    #   쌓인 뒤에는 budget-basis 가 관측 근거로 재조정할 수 있다.
      # 근거 현황 확인: python tools/ledger.py budget-basis
      #
      # ※ 예산은 **조정값(tunables)이 아니다.** ORCH_OVERRIDE 로 바꿀 수 없고 거부된다.
      #   예산의 산지는 정본(AGENTS.md B-1) 아니면 관측이고, 그 판단은 사람 몫이다.
      #   개발 중 바꿔 가며 쓰는 값은 (c) 판정 규칙·(d) 모델 가정뿐이다 → python tools/_common.py tunables
    goldenset: []                   # 확정: 사람
    fingerprints: []                # 확정: 사람 — 비어 있으면 규모 타당성은 "대조 대상 없음"

  # ── 확정 제품 ──────────────────────────────────────────────────────────────
  #
  # ★ **요구사항이 임계의 산지다.** 아래 값은 관측도 추정도 아니고 **제품 요구 명세**다
  #   (사용자 확정 2026-08-03). 그래서 `확정_대기` 가 없다.
  #
  # ★ 빔폭 둘을 헷갈리면 안 된다 — 해상 레이더는 두 축의 요구가 **반대 방향**이다.
  #     HBW(수평·방위)  < 4.0°   좁아야 한다 — 방위 분해능
  #     VBW(수직·고각)  > 25°    넓어야 한다 — 선체 동요 중에도 표적을 놓치지 않게
  #   한 이름(`hbw_target_deg`)에 둘을 넣으면 한쪽이 반드시 틀린다. 축을 나눠 적는다.
  #
  # ★ 부등호가 임계의 **모양을 정한다.** `> 23 dBi` 는 하한만 있는 요구다.
  #   [lo, hi] 꼴에 억지로 넣으면 없는 상한을 지어내게 된다 → `null` 로 열어 둔다.

  # ── 예시 등재 (양식 견본) ──────────────────────────────────────────────────
  #
  # ★ 이것은 **양식**이다. 실제 값이 아니다. 자기 제품을 등재할 때 이 블록을 복사해
  #   키 이름과 값을 바꾼다. 근거 없는 칸은 채우지 말고 `null` 로 둔다 — 비어 있는 것이
  #   지어낸 것보다 낫다(I-5 · N-3).
  #
  # ★ 실제 제품 정의는 이 파일이 아니라 `$ORCH_DATA_DIR/registry/products.yaml` 또는
  #   `registry/declared/<제품>.yaml` 에 둔다. 여기 적으면 플러그인을 갱신할 때 덮인다.

  example_x_band:
    label: "예시 · X 대역 안테나 (양식 견본 — 실제 값 아님)"
    use: "여기에 용도를 한 줄로 적는다. 모르면 null 로 둔다"
    산지: "예시 — 실제 등재 시 '요구 명세 · 확정 YYYY-MM-DD' 처럼 산지를 적는다"
    band_ghz: [9.3, 9.5]            # 동작 주파수 범위
    f0_ghz: 9.4                     # 타겟 주파수 — 재질·형상 해석의 기준점(Q-16)
    substrate:
      name: null                    # 데이터시트가 오면 채운다
      er: null
      er_ref_ghz: 10.0              # ★ 유전율의 **측정 주파수**. εr 은 주파수 종속이라
                                    #   값만으로는 쓸 수 없다(I-N). 데이터시트 관례가 10 GHz 다.
      h_mm: null
    requirements:                   # 요구 명세 — 부등호를 그대로 옮긴다
      gain_dbi:            {min: 23.0,  max: null,  note: "> 23 dBi"}
      return_loss_db:      {min: null,  max: -10.0, note: "< -10 dB"}
      sidelobe_level_db:   {min: null,  max: -23.0, note: "< -23 dB"}
      hbw_deg:             {min: null,  max: 4.0,   axis: "수평(방위)", note: "< 4.0 deg"}
      vbw_deg:             {min: 25.0,  max: null,  axis: "수직(고각)", note: "> 25 deg"}
    thresholds:
      resonance_tol: null           # 요구 명세에 없으면 지어내지 않는다
      hbw_target_deg: [0.0, 4.0]    # 상한만 있는 요구를 구간으로 옮긴 것
      vbw_target_deg: [25.0, null]  # 하한만 있다 — 상한을 지어내지 않는다
      hbw_uniform_factor: null      # 모델 가정 — 테이퍼 조명이면 사람이 채운다
      pitch_tol: 0.05
      scale_bbox_mm: [1.0, 2000.0]
    budgets: {max_gate_rejects: 3, max_retries: 3, compute_minutes: 10}
    goldenset: []
    fingerprints: []
