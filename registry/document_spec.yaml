    - {id: evidence,  label: "값의 산지",    source: "refs_used"}
    - {id: gate,      label: "게이트 판정",  source: "gate"}
    - {id: exempt,    label: "예외 적용",    source: "exempt_hits"}
    - {id: unjudged,  label: "임계 미지정",  source: "check_unjudged"}
    - {id: visuals,   label: "도면 · 렌더",  source: "render_artifacts"}
    - {id: gaps,      label: "업데이트 필요", source: "gaps"}
  # 배지 — 사람 검수가 반드시 보아야 하는 표시
  badges:
